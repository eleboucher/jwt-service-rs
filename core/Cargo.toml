[package]
name = "jwt-service-core"
version = "0.1.2"
edition = "2024"
publish = false
repository = "https://github.com/JadedBlueEyes/jwt-service-rs"
description = "MSC4195 identifier derivations and LiveKit access-token minting"

[dependencies]
base64 = "0.22"
livekit-api = { version = "0.4.4", default-features = false, features = ["access-token"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
